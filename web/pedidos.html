<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pedidos de reembolso</title>
<link rel="stylesheet" href="/style.css"><meta name="theme-color" content="#235e49"><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png"><link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Reembolso"><script src="/pwa.js" defer></script>
<body>
<main id="conteudo" tabindex="-1" class="pedidos-main">
  <header><div class="eyebrow">BANESCAIXA · REEMBOLSOS</div><h1>Pedidos de reembolso</h1><p>Consulte seus pedidos e registre os valores recebidos.</p><a class="button" href="/">Novo pedido</a></header>
  <section aria-label="Filtros">
    <div class="grid"><label>Solicitante<select id="solicitante" disabled><option value="">Todos os solicitantes</option></select></label><label>Dependente<select id="dependente" disabled><option value="">Todos os dependentes</option></select></label></div>
    <button type="button" id="limpar" class="secondary">Limpar filtros</button>
    <p>Os pedidos seguem o ano da data informada no formulário. Consulte os outros anos no rodapé. Os totais consideram o ano exibido e os filtros selecionados.</p>
  </section>
  <div id="error" role="alert" tabindex="-1"></div>
  <p id="pedido-status" class="pedidos-status" role="status" tabindex="-1"></p>
  <div id="resumo" class="pedidos-summary" aria-live="polite"></div>
  <div id="pedidos" aria-busy="true"><p>Carregando pedidos…</p></div>
  <footer id="anos" class="year-footer"></footer>
</main>
<script src="/session.js"></script><script src="/validation.js"></script><script src="/pedidos.js"></script>
</body>
</html>
